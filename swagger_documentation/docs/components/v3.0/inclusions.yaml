# v3-only component additions (merged after the v2.0 baseline and exclusions).
schemas:
  ItemsCreator:
    required:
    - items
    type: object
    properties:
      items:
        type: array
        description: List of item ids
        example:
        - 2000003
        - 2000004
        items:
          type: integer
  # v3 British-spelled licence catalogue object (v2 keeps `License`). Same shape as `License`.
  Licence:
    required:
    - name
    - url
    - value
    type: object
    properties:
      value:
        type: integer
        description: Licence value
      name:
        type: string
        description: Licence name
      url:
        type: string
        description: Licence url
        format: url
  # v3 light item-list row (item nomenclature). Mirrors the v2 `Article` list shape but uses
  # item_type_id/item_type_name instead of defined_type/defined_type_name, and drops `timeline`.
  Item:
    required:
    - created_date
    - doi
    - handle
    - id
    - resource_doi
    - resource_title
    - thumb
    - title
    - url
    - url_private_api
    - url_private_html
    - url_public_api
    - url_public_html
    type: object
    properties:
      id:
        type: integer
        description: Unique identifier for item
        example: 1434614
      title:
        type: string
        description: Title of item
        example: Test item title
      doi:
        type: string
        description: DOI
        example: 10.6084/m9.figshare.1434614
      handle:
        type: string
        description: Handle
        example: 111184/figshare.1234
      url:
        type: string
        description: Api endpoint for item
        format: url
        example: http://api.figshare.com/v3/items/1434614
      url_public_html:
        type: string
        description: Public site endpoint for item
        format: url
      url_public_api:
        type: string
        description: Public Api endpoint for item
        format: url
      url_private_html:
        type: string
        description: Private site endpoint for item
        format: url
      url_private_api:
        type: string
        description: Private Api endpoint for item
        format: url
      thumb:
        type: string
        description: Thumbnail image
        format: url
      item_type_id:
        type: integer
        nullable: true
        description: Item type id
        example: 3
      item_type_name:
        type: string
        nullable: true
        description: Item type name
        example: dataset
      resource_doi:
        type: string
        description: Deprecated by related materials. Not applicable to regular users. In a publisher case, this is the publisher
          item DOI.
        default: ''
      resource_title:
        type: string
        description: Deprecated by related materials. Not applicable to regular users. In a publisher case, this is the publisher
          item title.
        default: ''
      created_date:
        type: string
        description: Date when item was created
        example: '2017-05-18T11:49:03Z'
      modified_date:
        type: string
        description: Date when item was last modified
        example: '2017-05-18T11:49:03Z'
      published_date:
        type: string
        description: Date when item was first published, null if not published
        example: '2017-05-18T11:49:03Z'
      group_id:
        type: integer
        description: Group ID of the item
        example: 1
    x-tag: items
  # v3 light item-list row scoped to a project (Item + project_id).
  ItemWithProject:
    required:
    - project_id
    properties:
      project_id:
        type: integer
        description: Project id for this item.
        example: 1
        default: 0
    allOf:
    - $ref: '#/components/schemas/Item'
    x-tag: items
  # v3 item sub-resource schemas (Item*-named; structurally identical to the v2 Article* versions,
  # descriptions reworded to "item"). The ItemEmbargo.embargo_type enum keeps its real backend
  # values (article, file) — those are data (embargo level), not nomenclature.
  ItemConfidentiality:
    required:
    - is_confidential
    - reason
    type: object
    properties:
      is_confidential:
        type: boolean
        description: True if item is confidential
        example: true
      reason:
        type: string
        description: Reason for confidentiality
        example: need to
    x-tag: items
  ItemEmbargo:
    required:
    - embargo_options
    - embargo_reason
    - embargo_title
    - is_embargoed
    type: object
    properties:
      is_embargoed:
        type: boolean
        description: True if embargoed
        example: true
      embargo_date:
        type: string
        description: Date when the embargo expires and the item gets published, null if not embargoed
        example: '2018-05-22T04:04:04'
      embargo_type:
        type: string
        description: 'Embargo level. Possible values: article, file'
        example: file
        enum:
        - article
        - file
      embargo_title:
        type: string
        description: Title for embargo
        example: File(s) under embargo
      embargo_reason:
        type: string
        description: Reason for embargo
        example: ''
      embargo_options:
        type: array
        description: List of embargo permissions that are associated with the item. If the type is logged_in and the group_ids
          list is empty, then the whole institution can see the item; if there are multiple group_ids, then only users
          that are under those groups can see the item.
        example:
        - id: 13
          type: ip_range
          group_ids: []
          ip_name: bacau
        - id: 12
          type: logged_in
          ip_name: ''
          group_ids:
          - 550
          - 9448
        items:
          type: object
          properties: {}
    x-tag: items
  ItemDOI:
    required:
    - doi
    type: object
    properties:
      doi:
        type: string
        description: Reserved DOI
        example: 10.5072/FK2.FIGSHARE.20345
    x-tag: items
  ItemHandle:
    required:
    - handle
    type: object
    properties:
      handle:
        type: string
        description: Reserved Handle
        example: 11172/FK2.FIGSHARE.20345
    x-tag: items
  ItemVersions:
    required:
    - url
    - version
    type: object
    properties:
      version:
        type: integer
        description: Version number
        example: 1
      url:
        type: string
        description: Api endpoint for the item version
        format: url
        example: https://api.figshare.com/v3/items/2000005/versions/1
    x-tag: items
  PersonListAffiliation:
    type: object
    description: An affiliation of a person on this item, collection or project. ROR-identified (`ror_id` + `name`)
      or free text (`name` only). Order is the array order.
    properties:
      ror_id:
        type: string
        description: Short ROR id. Accepted on write as the short id or as `https://ror.org/<id>`; always returned short.
          Left out for free-text affiliations.
        example: 041kmwe10
      name:
        type: string
        description: Affiliation name (max 255 characters).
        example: Imperial College London
    x-tag: authors
  PersonListEntry:
    description: 'One entry of a person_list field (`authors`, `supervisors` and custom person lists) as returned
      on GET: a person (`type` 1, `PersonListPerson`) or an organization (`type` 2, `PersonListOrganization`).
      Each entry points to a user: an account user, a ghost user (no account, no public profile) or an organization
      user. The user''s current values are merged with what was overridden on this item, emails are masked, and empty
      values are left out. Order is the array order. The entry is in the write format, so it can be sent back
      unchanged (`PersonListEntryCreate`): unchanged values aren''t stored as overrides, masked emails are ignored and
      the read-only `has_account` / `is_active` are dropped.'
    oneOf:
    - $ref: '#/components/schemas/PersonListPerson'
    - $ref: '#/components/schemas/PersonListOrganization'
    x-tag: authors
  PersonListPerson:
    type: object
    description: A person (`type` 1) in a person_list field, as returned on GET.
    required:
    - type
    - user_id
    - has_account
    - is_active
    properties:
      type:
        type: integer
        enum:
        - 1
        description: 1 = person.
        example: 1
      user_id:
        type: integer
        description: The user this entry points to. Use it to send the entry back, or to delete it from the authors.
        example: 1000005
      has_account:
        type: boolean
        readOnly: true
        description: Whether the person has a Figshare account (false for ghost users). Read only, ignored on write.
        example: true
      is_active:
        type: boolean
        readOnly: true
        description: Whether the person has a Figshare account and that account is active. Read only, ignored on
          write.
        example: true
      first_name:
        type: string
        example: Jane
      last_name:
        type: string
        example: Smith
      email:
        type: string
        description: Masked email (e.g. `j********h@example.org`). A masked email sent back is ignored.
        example: j********h@example.org
      orcid_id:
        type: string
        example: 0000-0002-1825-0097
      affiliations:
        type: array
        description: The person's affiliations on this item.
        items:
          $ref: '#/components/schemas/PersonListAffiliation'
    x-tag: authors
  PersonListOrganization:
    type: object
    description: An organization (`type` 2) in a person_list field, as returned on GET. Organizations have no account
      status (`has_account` / `is_active`) and no affiliations.
    required:
    - type
    - user_id
    properties:
      type:
        type: integer
        enum:
        - 2
        description: 2 = organization.
        example: 2
      user_id:
        type: integer
        description: The organization user this entry points to. Use it to send the entry back, or to delete it
          from the authors.
        example: 2000001
      name:
        type: string
        example: Wellcome Sanger Institute
      ror_id:
        type: string
        description: Short ROR id of the organization itself.
        example: 05cy4wa09
      email:
        type: string
        description: Masked email (e.g. `i**o@sanger.ac.uk`). A masked email sent back is ignored.
        example: i**o@sanger.ac.uk
      contributors:
        type: string
        description: Free-text list of the people behind the organization on this item.
        example: Jane Smith, John Doe
    x-tag: authors
  PersonListEntryCreate:
    type: object
    description: 'One entry of a person_list field (`authors`, `supervisors` and custom person lists) on create/update,
      in `fields.<field name>` or in the authors endpoints: a person (`type` 1) or an organization (`type` 2). Some
      keys belong to one type only (see each key); a key of the other type is rejected. Validation errors return 422
      with the path of the offending value, e.g. `authors[1].affiliations[0].ror_id`.


      **With `user_id`** (a user from the author search, or an entry read back from GET): the user must exist. For
      people, `first_name`, `last_name`, `email` and `orcid_id` are compared with the user and only differences are stored
      as overrides on this item; for these keys a missing key keeps the stored override and `null` clears the value on
      this item. For organizations only `email` can be overridden (`name` and `ror_id` are ignored). `affiliations`
      and `contributors` belong to the entry, not to the user: they are stored as sent, so leaving them out removes
      them.


      **Without `user_id`** (a typed entry): `type` is required. People need `last_name`, organizations need `name`.
      The entry is matched exactly to an existing user on name + email + ORCID (people) or name + `ror_id` + email (organizations),
      all three non-empty; otherwise a new user without an account (ghost person or organization) is created.


      Rules: the same user once per field; at most 10 affiliations per person; strings up to 255 characters
      (`contributors` up to 2000); the account''s `max_authors` limit (default 100) applies to every person_list.
      Unknown keys are rejected, including `is_corresponding`, which is no longer supported; `has_account` and
      `is_active` (returned on GET) are ignored.'
    properties:
      user_id:
        type: integer
        description: An existing user. When set, `type` is optional (taken from the user).
        example: 1000005
      type:
        type: integer
        description: 1 = person, 2 = organization. Required without `user_id`.
        example: 1
      first_name:
        type: string
        nullable: true
        description: People only.
        example: Jane
      last_name:
        type: string
        nullable: true
        description: People only. Required for a typed person.
        example: Smith
      name:
        type: string
        nullable: true
        description: Organizations only. Required for a typed organization.
        example: Wellcome Sanger Institute
      email:
        type: string
        nullable: true
        example: jane.smith@example.org
      orcid_id:
        type: string
        nullable: true
        description: People only.
        example: 0000-0002-1825-0097
      ror_id:
        type: string
        nullable: true
        description: Organizations only. The organization's own ROR id (short id or `https://ror.org/<id>`), used to
          match an existing organization or to create a new one. A person's institutions go in `affiliations[].ror_id`.
        example: 05cy4wa09
      contributors:
        type: string
        nullable: true
        description: Organizations only. Free-text list of the people behind the organization. Stored as sent; leaving
          it out removes it.
        example: Jane Smith, John Doe
      affiliations:
        type: array
        nullable: true
        description: People only. Stored as sent; leaving them out (or `null`) removes the entry's affiliations.
        items:
          $ref: '#/components/schemas/PersonListAffiliation'
    x-tag: authors
  PersonListAuthorsCreator:
    type: object
    required:
    - authors
    properties:
      authors:
        type: array
        description: Author entries. POST appends them to the stored authors, PUT replaces the stored authors.
        items:
          $ref: '#/components/schemas/PersonListEntryCreate'
    example:
      authors:
      - user_id: 1000005
      - user_id: 1000006
        last_name: Smith-Jones
        affiliations:
        - ror_id: 041kmwe10
          name: Imperial College London
        - name: Free-text affiliation
      - type: 1
        first_name: Jane
        last_name: Doe
        email: jane.doe@example.org
      - type: 2
        name: Wellcome Sanger Institute
        ror_id: https://ror.org/05cy4wa09
        contributors: Jane Smith, John Doe
    x-tag: authors
